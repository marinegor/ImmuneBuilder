[workspace]
authors = ["Brennan Abanades Kenyon <brennan.abanadeskenyon@stx.ox.ac.uk>"]
channels = ["https://prefix.dev/conda-forge", "bioconda"]
name = "ImmuneBuilder"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
generate-nanobodies = "python generate_nanobodies.py"

[dependencies]
openmm = ">=8.5.1,<9"
pdbfixer = ">=1.12,<2"
anarci = ">=2024.5.21,<2025"
llvm-openmp = ">=22.1.4,<23"

[feature.gpu]
platforms = ["linux-64"]

[feature.gpu.system-requirements]
cuda = "12"

[feature.gpu.dependencies]
cuda-version = "12.*"
pytorch-gpu = "*"

[feature.cpu.dependencies]
pytorch-cpu = "*"

[pypi-dependencies]
immunebuilder = ">=1.2, <2"
polars = ">=1.40.1, <2"
immunum = ">=1.1.0, <2"
typer = ">=0.25.0, <0.26"
loguru = ">=0.7.3, <0.8"
tqdm = ">=4.67.3, <5"
ray = { version = ">=2.55.1, <3", extras = ["default"] }

[environments]
cpu = ["cpu"]
default = ["gpu"]
